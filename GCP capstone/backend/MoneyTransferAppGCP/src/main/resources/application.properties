# ============================================================
# Application
# ============================================================
spring.application.name=MoneyTransfer

# ============================================================
# DataSource - MySQL
# ============================================================
spring.datasource.url=jdbc:mysql://localhost:3306/moneytransfer
spring.datasource.username=root
spring.datasource.password=admin
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ============================================================
# SQL Init - auto-run schema + seed data on startup
# ============================================================
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.sql.init.data-locations=classpath:db/data.sql

# ============================================================
# JPA / Hibernate
# ============================================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ============================================================
# Security - in-memory users (override in prod with DB users)
# ============================================================
spring.security.user.name=admin
spring.security.user.password=admin

# ============================================================
# Server
# ============================================================
server.port=8080
server.servlet.context-path=/

# ============================================================
# Logging
# ============================================================
logging.level.root=INFO
logging.level.com.example.moneytransfer=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
